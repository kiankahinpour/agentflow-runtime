[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "agentflow-durable"
dynamic = ["version"]
description = "Durable local task execution for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
postgres-pool = ["psycopg[binary]>=3.1,<4", "psycopg_pool>=3.2,<4"]
secrets = ["cryptography>=42,<51"]
server = ["fastapi>=0.111,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.111,<1", "cryptography>=42,<51"]
[project.scripts]
agentflow = "agentflow_runtime.cli:main"
agentflow-desktop = "agentflow_runtime.desktop:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.dynamic]
version = {attr = "agentflow_runtime._version.__version__"}
[tool.setuptools.package-data]
agentflow_runtime = ["dashboard.html"]
[tool.pytest.ini_options]
pythonpath = ["src"]
