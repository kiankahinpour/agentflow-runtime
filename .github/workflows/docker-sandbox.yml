name: Docker sandbox smoke
on:
  push:
  pull_request:
jobs:
  docker-isolation-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run a digest-pinned container with default restrictions
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          PINNED="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-alpine)"
          test -n "$PINNED"
          python tools/docker_smoke.py --image "$PINNED" --command cat
