name: PostgreSQL integration
on:
  push:
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentflow_ci
          POSTGRES_USER: agentflow_ci
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentflow_ci -d agentflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTFLOW_TEST_POSTGRES_DSN: postgresql://agentflow_ci:test-only-password@localhost:5432/agentflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,postgres-pool]'
      - run: python -m pytest -q tests/test_v080.py tests/test_v080_pg_integration.py tests/test_v090.py tests/test_v090_pg_integration.py tests/test_v100_pg_integration.py
